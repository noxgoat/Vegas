# JurisBusca SP + HTTPS automático (Caddy / Let's Encrypt).
# Uso: veja docs/HOSPEDAGEM_GRATIS.md. Variáveis lidas do arquivo .env desta pasta.
services:
  app:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      JURIS_DATA_DIR: /data
    volumes:
      - ./dados:/data
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
